{% extends 'ecommerce/base.html' %}{% block title %}Create account | Shivika{% endblock %}{% block extra_css %}<style>.auth-wrap{max-width:460px;margin:50px auto}.auth-card{background:white;border:1px solid var(--line);border-radius:12px;padding:32px}.auth-card h1{font-family:'Playfair Display',serif;margin-top:0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.auth-card label{display:block;margin:14px 0 6px;font-weight:600}.auth-card input{width:100%;border:1px solid var(--line);border-radius:7px;padding:12px}.auth-card .btn{margin-top:18px}.auth-card p{text-align:center;color:var(--muted)}.auth-card p a{color:var(--pink);font-weight:700}@media(max-width:500px){.grid2{grid-template-columns:1fr}}</style>{% endblock %}{% block content %}<main class="auth-wrap"><form class="auth-card" method="post">{% csrf_token %}<h1>Create account</h1><div class="grid2"><div><label>First name</label><input name="first_name" required></div><div><label>Last name</label><input name="last_name"></div></div><label>Username</label><input name="username" required><label>Email</label><input type="email" name="email" required><label>Password</label><input type="password" name="password" minlength="8" required><button class="btn pink full">Create my account</button><p>Already a member? <a href="{% url 'login' %}">Sign in</a></p></form></main>{% endblock %}
