{% extends 'ecommerce/base.html' %}{% block title %}Sign in | Shivika{% endblock %}{% block extra_css %}<style>.auth-wrap{max-width:420px;margin:60px auto}.auth-card{background:white;border:1px solid var(--line);border-radius:12px;padding:32px}.auth-card h1{font-family:'Playfair Display',serif;margin-top:0}.auth-card label{display:block;margin:14px 0 6px;font-weight:600}.auth-card input{width:100%;border:1px solid var(--line);border-radius:7px;padding:12px}.auth-card .btn{margin-top:18px}.auth-card p{text-align:center;color:var(--muted);margin-top:20px}.auth-card p a{color:var(--pink);font-weight:700}</style>{% endblock %}{% block content %}<main class="auth-wrap"><form class="auth-card" method="post">{% csrf_token %}<h1>Welcome back</h1><p style="text-align:left">Sign in to manage your wishlist and orders.</p><label>Username</label><input name="username" autocomplete="username" required><label>Password</label><input type="password" name="password" autocomplete="current-password" required><button class="btn pink full">Sign in</button><p>New to Shivika? <a href="{% url 'register' %}">Create an account</a></p></form></main>{% endblock %}
